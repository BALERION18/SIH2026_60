# -----------------------------------------------------------------------
# Alert threshold rules
# -----------------------------------------------------------------------
threshold_rules:
  # Fuel — Generator 1
  - sensor_id: maitri.energy.gen1.fuel_pct
    metric_name: fuel_level_percent
    condition: lte
    threshold_value: 30.0
    severity: HIGH
    description_template: "Generator 1 fuel low: {value:.1f}% (threshold: {threshold}%)"

  - sensor_id: maitri.energy.gen1.fuel_pct
    metric_name: fuel_level_percent
    condition: lte
    threshold_value: 15.0
    severity: CRITICAL
    description_template: "Generator 1 fuel CRITICAL: {value:.1f}% (threshold: {threshold}%)"

  # Generator 1 fault
  - sensor_id: maitri.energy.gen1.status
    metric_name: generator_status
    condition: eq
    threshold_value: 2.0
    severity: CRITICAL
    description_template: "Generator 1 FAULT detected"

  # Oil pressure low
  - sensor_id: maitri.energy.gen1.oil_pressure_bar
    metric_name: oil_pressure_bar
    condition: lt
    threshold_value: 3.0
    severity: HIGH
    description_template: "Generator 1 oil pressure low: {value:.2f} bar"

  # Coolant overtemp
  - sensor_id: maitri.energy.gen1.coolant_temp_c
    metric_name: coolant_temp_c
    condition: gte
    threshold_value: 105.0
    severity: CRITICAL
    description_template: "Generator 1 coolant overtemperature: {value:.1f}°C"

  # Grid overload
  - sensor_id: maitri.energy.grid.total_load_kw
    metric_name: total_load_kw
    condition: gte
    threshold_value: 180.0
    severity: HIGH
    description_template: "Grid load critically high: {value:.1f} kW (limit: {threshold} kW)"

  # Weather — wind
  - sensor_id: maitri.weather.aws.wind_speed_ms
    metric_name: wind_speed_ms
    condition: gte
    threshold_value: 25.0
    severity: MEDIUM
    description_template: "High winds: {value:.1f} m/s"

  - sensor_id: maitri.weather.aws.wind_speed_ms
    metric_name: wind_speed_ms
    condition: gte
    threshold_value: 45.0
    severity: HIGH
    description_template: "Storm-force winds: {value:.1f} m/s — blizzard conditions"

  # Air quality
  - sensor_id: maitri.environment.aq1.co_ppm
    metric_name: co_ppm
    condition: gte
    threshold_value: 35.0
    severity: HIGH
    description_template: "CO concentration above OSHA PEL: {value:.1f} ppm"

  - sensor_id: maitri.environment.aq1.co_ppm
    metric_name: co_ppm
    condition: gte
    threshold_value: 100.0
    severity: CRITICAL
    description_template: "CO concentration CRITICAL: {value:.1f} ppm — evacuate immediately"

  # Fire detection
  - sensor_id: maitri.environment.fire_z1.state
    metric_name: fire_state
    condition: eq
    threshold_value: 1.0
    severity: CRITICAL
    description_template: "FIRE DETECTED — Zone 1 (Main Building)"

  - sensor_id: maitri.environment.fire_z2.state
    metric_name: fire_state
    condition: eq
    threshold_value: 1.0
    severity: CRITICAL
    description_template: "FIRE DETECTED — Zone 2 (Lab Building)"

  - sensor_id: maitri.environment.fire_z3.state
    metric_name: fire_state
    condition: eq
    threshold_value: 1.0
    severity: CRITICAL
    description_template: "FIRE DETECTED — Zone 3 (Generator Room)"

  # Seismic
  - sensor_id: maitri.environment.seismic.magnitude
    metric_name: seismic_magnitude
    condition: gte
    threshold_value: 3.0
    severity: MEDIUM
    description_template: "Seismic event: M{value:.1f}"

  - sensor_id: maitri.environment.seismic.magnitude
    metric_name: seismic_magnitude
    condition: gte
    threshold_value: 4.5
    severity: HIGH
    description_template: "Significant seismic event: M{value:.1f}"

  - sensor_id: maitri.environment.seismic.magnitude
    metric_name: seismic_magnitude
    condition: gte
    threshold_value: 6.0
    severity: CRITICAL
    description_template: "MAJOR SEISMIC EVENT: M{value:.1f} — initiate safety protocols"

# -----------------------------------------------------------------------
# Rate-of-change rules
# -----------------------------------------------------------------------
rate_of_change_rules:
  - sensor_id: maitri.energy.gen1.fuel_pct
    max_rate_per_minute: 2.0  # pct/min — abnormal if fuel drops > 2% per minute
    severity: HIGH
    description_template: "Abnormal fuel consumption rate: {rate:.2f}%/min"

# -----------------------------------------------------------------------
# Composite rules
# -----------------------------------------------------------------------
composite_rules:
  - rule_id: maitri.composite.gen1_blackout
    description: "Generator 1 output drops to zero while load is non-zero"
    condition_expression: "gen1_output <= 0 and grid_load > 5"
    severity: CRITICAL
    description_template: "Generator 1 blackout: output={gen1_output:.1f} kW, load={grid_load:.1f} kW"
