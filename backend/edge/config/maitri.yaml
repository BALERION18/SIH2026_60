# Lakshya Station Configuration — Maitri Research Station
# Schirmacher Oasis, Dronning Maud Land, Antarctica
# DO NOT hardcode station_id in application code — always read from this file.

station_id: maitri
display_name: "Maitri Research Station"
location: "Schirmacher Oasis, Dronning Maud Land, Antarctica"
latitude: -70.7683
longitude: 11.8268
elevation_m: 130.0
timezone: UTC

heartbeat_timeout_minutes: 15

black_box:
  trigger_severities: [CRITICAL]
  pre_event_window_s: 300    # 5 minutes
  post_resolution_tail_s: 900 # 15 minutes

sync:
  heartbeat_interval_s: 60
  max_queue_size_bytes: 1073741824  # 1 GB
  queue_retention_days: 30
  telemetry_batch_window_s:
    energy: 300       # 5 minutes
    weather: 900      # 15 minutes
    environment: 900  # 15 minutes
    logistics: 3600   # 1 hour

  # ── Message-type priority (lower = higher priority) ──────────────────
  priority_map:
    BLACK_BOX_FRAME:    0   # Life safety — never drop, always first
    ALERT_CRITICAL:     1   # Fire, CO, generator fault, blackout
    ALERT_HIGH:         1   # Fuel low, storm warning, oil pressure
    ALERT_MEDIUM:       2   # Wind speed, grid fluctuation
    ALERT_LOW:          2   # Background monitoring
    ALERT_ACK:          2   # Acknowledgement
    LINK_HEARTBEAT:     2   # Keep-alive
    INVENTORY_SNAPSHOT: 3   # Daily stock updates
    SENSOR_BATCH:       3   # Normal telemetry (default)

  # ── Domain priority — sensor domain → base priority ──────────────────
  # Used when a SENSOR_BATCH domain carries urgent data
  domain_priority:
    environment: 1    # CO, fire zone — life safety
    energy:      2    # Generator, fuel, grid — operational critical
    weather:     3    # Temperature, wind, pressure — routine
    seismic:     4    # Background seismic — low urgency
    logistics:   3    # Inventory — routine

  # ── Quality-based priority bump ───────────────────────────────────────
  # When sensor quality is not NOMINAL, priority is bumped up by this amount
  quality_priority_bump:
    SUSPECT: 1    # Bump priority up by 1 (e.g. 3 → 2)
    FAILED:  0    # FAILED data gets priority 0 — must investigate

  # ── Bandwidth-aware sending thresholds ───────────────────────────────
  # Network quality % → max priority level allowed to send
  # (items with priority > max_priority are held back)
  bandwidth_thresholds:
    good:        { min_pct: 80, max_priority: 4 }   # Send everything
    medium:      { min_pct: 40, max_priority: 3 }   # Hold seismic/low
    slow:        { min_pct: 10, max_priority: 2 }   # Only alerts + energy
    critical:    { min_pct: 0,  max_priority: 1 }   # Only CRITICAL alerts + black box

# -----------------------------------------------------------------------
# Local API Authentication (offline-capable pre-provisioned keys)
# Format: ROLE.hex_secret (32-byte hex = 256-bit entropy)
# Rotate at each resupply expedition. Store this file with restricted perms.
# Generate new keys: python3 -m edge.auth.local_auth  OR  make keygen-edge
# -----------------------------------------------------------------------
local_api_keys:
  - "CREW.4a7f2b91e3c0d85a1f6e9b2c4d7e0f3a1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"
  - "OPERATOR.d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a391e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7"
