# -----------------------------------------------------------------------
# Sensors
# -----------------------------------------------------------------------
sensors:
  # Energy — Generator 1
  - sensor_id: maitri.energy.gen1.fuel_pct
    domain: energy
    asset_id: maitri.gen1
    metric_name: fuel_level_percent
    unit: pct
    sampling_interval_s: 10
    nominal_min: 0.0
    nominal_max: 100.0
    calibration:
      offset: 0.0
      scale: 1.0
      stuck_threshold: 0.01
      stuck_window_readings: 20
      max_rate_per_reading: 5.0

  - sensor_id: maitri.energy.gen1.power_output_kw
    domain: energy
    asset_id: maitri.gen1
    metric_name: power_output_kw
    unit: kW
    sampling_interval_s: 10
